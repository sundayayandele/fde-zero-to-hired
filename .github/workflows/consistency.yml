name: Consistency check

# Fails a push or pull request if phases/, capstones/ or docs/ are out of sync
# with CURRICULUM.md, or if any relative link is broken.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generated files match CURRICULUM.md and links resolve
        run: python scripts/check_repo.py
